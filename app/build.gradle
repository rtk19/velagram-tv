plugins { id 'com.android.application' }
def secrets = new Properties()
def secretsFile = rootProject.file('config/local.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }
def quoted = { String key -> '"' + secrets.getProperty(key, '').replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
 namespace 'com.velagram.tv'
 compileSdk 35
 buildToolsVersion '36.0.0'
 defaultConfig {
  applicationId 'com.velagram.tv'
  minSdk 26
  targetSdk 35
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  versionCode 4
  versionName '1.3.0-tv'
  buildConfigField 'String', 'TMDB_TOKEN', quoted('TMDB_READ_ACCESS_TOKEN')
  buildConfigField 'String', 'SUBDL_KEY', quoted('SUBDL_API_KEY')
  buildConfigField 'String', 'TELEGRAM_API_ID', quoted('TELEGRAM_API_ID')
  buildConfigField 'String', 'TELEGRAM_API_HASH', quoted('TELEGRAM_API_HASH')
 }
 buildFeatures { buildConfig true }
 signingConfigs {
  local { storeFile rootProject.file('config/velagram-tv.jks'); storePassword 'velagram-local'; keyAlias 'velagram'; keyPassword 'velagram-local' }
 }
 buildTypes { debug { signingConfig signingConfigs.local }; release { minifyEnabled false; signingConfig signingConfigs.local } }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging = true }; resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'org.videolan.android:libvlc-all:3.6.5'
 implementation 'androidx.fragment:fragment:1.8.6'
 implementation 'androidx.media3:media3-exoplayer:1.8.0'
 implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
 implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
 implementation 'androidx.media3:media3-ui:1.8.0'
 implementation 'androidx.media3:media3-session:1.8.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.zxing:core:3.5.3'
 implementation 'com.github.bumptech.glide:glide:4.16.0'
 implementation 'io.github.tdlib-android:core:0.1.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
